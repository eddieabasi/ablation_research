[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ablation"
version = "0.1.0"
description = "Controlled experiments on how ablation methods behave in toy transformers with known circuits"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
